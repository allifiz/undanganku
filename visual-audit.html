<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Temporary responsive audit</title>
<style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px;display:flex;gap:12px;align-items:center}iframe{display:block;border:0;margin:0 auto;background:#111}a{color:#123}</style>
<header>Audit sementara <a href="?w=1280">1280 × 800</a><a href="?w=768">768 × 1024</a><a href="?w=390">390 × 844</a><a href="?w=360">360 × 800</a><output id="size"></output></header>
<iframe title="Preview undangan" src="/"></iframe>
<script>
const sizes={1280:800,768:1024,390:844,360:800};
const width=Number(new URLSearchParams(location.search).get('w'))||390;
const frame=document.querySelector('iframe');
frame.width=sizes[width]?width:390;frame.height=sizes[width]||844;
frame.addEventListener('load',()=>{const w=frame.contentWindow;document.querySelector('output').textContent='Viewport: '+w.innerWidth+' × '+w.innerHeight;});
</script></html>
